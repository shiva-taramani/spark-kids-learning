<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dino Rescue Clinic - Apple-Simple Learning Game</title>
  <meta name="description" content="An Apple-simple, minimalist visual math and phonics game for young kids." />
  
  <!-- Apple San Francisco-inspired & friendly rounded fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       APPLE-INSPIRED MINIMALIST DESIGN SYSTEM
       ========================================================================== */
    :root {
      --bg-gradient: radial-gradient(circle at 50% 20%, #1e293b 0%, #0f172a 100%);
      --card-bg: rgba(255, 255, 255, 0.06);
      --card-border: rgba(255, 255, 255, 0.12);
      --card-shadow: 0 20px 40px rgba(0, 0, 0, 0.25);
      
      --accent-gold: #ffb703;
      --accent-orange: #fb8500;
      --accent-blue: #38bdf8;
      --accent-emerald: #34d399;
      --accent-coral: #fb7185;
      
      --text-primary: #f8fafc;
      --text-secondary: #94a3b8;
      
      --font-main: 'Fredoka', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-body: 'Quicksand', -apple-system, BlinkMacSystemFont, sans-serif;
      
      --radius-xl: 32px;
      --radius-lg: 24px;
      --radius-md: 16px;
      --radius-sm: 12px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg-gradient);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px;
      overflow-x: hidden;
    }

    /* Minimalist Top Navigation Bar */
    header {
      width: 100%;
      max-width: 980px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      padding: 12px 24px;
      border-radius: var(--radius-xl);
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-main);
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: 0.3px;
    }

    .brand-icon {
      font-size: 1.8rem;
    }

    .pill-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .segmented-control {
      background: rgba(0, 0, 0, 0.3);
      padding: 4px;
      border-radius: 20px;
      display: flex;
      gap: 4px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .segment-btn {
      background: transparent;
      border: none;
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.88rem;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .segment-btn.active {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    }

    .btn-sound {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: white;
      font-family: var(--font-main);
      font-size: 0.9rem;
      padding: 6px 14px;
      border-radius: 20px;
      cursor: pointer;
    }

    .star-badge {
      background: rgba(255, 183, 3, 0.15);
      border: 1px solid rgba(255, 183, 3, 0.3);
      color: var(--accent-gold);
      padding: 6px 14px;
      border-radius: 20px;
      font-family: var(--font-main);
      font-size: 0.9rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Main App Layout */
    main {
      width: 100%;
      max-width: 980px;
      display: grid;
      grid-template-columns: 320px 1fr;
      gap: 20px;
      align-items: start;
    }

    @media (max-width: 820px) {
      main {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 24px;
      box-shadow: var(--card-shadow);
    }

    /* Dino Patient Stage */
    .patient-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .patient-title {
      font-family: var(--font-main);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .progress-pill-track {
      width: 100%;
      height: 14px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 20px;
      padding: 2px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 16px;
    }

    .progress-pill-fill {
      height: 100%;
      width: 25%;
      background: linear-gradient(90deg, var(--accent-emerald), var(--accent-blue));
      border-radius: 20px;
      transition: width 0.5s ease;
    }

    .dino-stage-box {
      width: 100%;
      height: 220px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, rgba(0,0,0,0.2) 70%);
      border-radius: var(--radius-lg);
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .dino-avatar {
      width: 170px;
      height: 170px;
      transition: transform 0.4s ease;
    }

    .dino-avatar.happy {
      animation: gentle-bounce 0.8s ease infinite alternate;
    }

    .dirt-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .dirt-dot {
      position: absolute;
      background: #4a3324;
      border-radius: 50%;
      opacity: 0.8;
      transition: all 0.4s ease;
    }

    .status-text {
      margin-top: 14px;
      font-size: 0.95rem;
      color: var(--text-secondary);
      font-family: var(--font-main);
    }

    /* Workspace & Answer Display */
    .workspace-card {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .question-banner {
      text-align: center;
      padding: 12px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: var(--radius-lg);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
    }

    .question-title {
      font-family: var(--font-main);
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .question-title .highlight {
      color: var(--accent-gold);
    }

    .btn-speaker {
      background: rgba(255, 183, 3, 0.2);
      border: 1px solid var(--accent-gold);
      color: var(--accent-gold);
      font-size: 1.2rem;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s ease;
    }

    .btn-speaker:hover {
      transform: scale(1.1);
    }

    .answer-display-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin: 4px 0;
    }

    .answer-box {
      min-width: 140px;
      height: 60px;
      background: rgba(0, 0, 0, 0.4);
      border: 3px solid var(--accent-gold);
      border-radius: var(--radius-lg);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-main);
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--accent-gold);
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.5);
      padding: 0 16px;
      letter-spacing: 2px;
      transition: all 0.2s ease;
    }

    .btn-clear {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      color: var(--text-secondary);
      font-family: var(--font-main);
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 16px;
      border-radius: var(--radius-md);
      cursor: pointer;
    }

    .btn-clear:hover {
      background: rgba(251, 113, 133, 0.2);
      color: var(--accent-coral);
    }

    /* Ten-Frame Dual Grid */
    .tenframe-dual-container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tenframe-section {
      background: rgba(0, 0, 0, 0.25);
      border-radius: var(--radius-lg);
      padding: 12px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .tenframe-label {
      font-family: var(--font-main);
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 6px;
      text-transform: uppercase;
    }

    .tenframe-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .tenframe-slot {
      aspect-ratio: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tenframe-slot:hover {
      background: rgba(255, 255, 255, 0.12);
      transform: scale(1.05);
    }

    .tenframe-slot.filled {
      border-style: solid;
      border-color: rgba(255, 255, 255, 0.4);
    }

    .egg-token {
      width: 82%;
      height: 82%;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent-gold), var(--accent-orange));
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      animation: pop-in 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .egg-token.secondary {
      background: linear-gradient(135deg, var(--accent-blue), #0284c7);
    }

    /* Keypad & Primary Check Button */
    .controls-area {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .keypad-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
    }

    .key-button {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: white;
      font-family: var(--font-main);
      font-size: 1.4rem;
      font-weight: 700;
      padding: 12px 0;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .key-button:hover {
      background: var(--accent-gold);
      color: #000;
      transform: translateY(-2px);
    }

    .primary-check-btn {
      background: linear-gradient(135deg, var(--accent-emerald), #059669);
      border: none;
      color: white;
      font-family: var(--font-main);
      font-size: 1.25rem;
      font-weight: 700;
      padding: 16px;
      border-radius: var(--radius-lg);
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(52, 211, 153, 0.3);
      transition: all 0.2s ease;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
    }

    .primary-check-btn:hover {
      transform: translateY(-2px);
    }

    /* Word Building Tiles */
    .word-slots-container {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin: 16px 0;
    }

    .word-tile-slot {
      width: 60px;
      height: 68px;
      background: rgba(0, 0, 0, 0.3);
      border: 2px dashed var(--accent-gold);
      border-radius: var(--radius-md);
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: var(--font-main);
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent-gold);
    }

    .word-tile-slot.filled {
      border-style: solid;
      background: rgba(56, 189, 248, 0.2);
      color: white;
    }

    .letter-tiles-bank {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .letter-tile-btn {
      width: 52px;
      height: 56px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-md);
      color: white;
      font-family: var(--font-main);
      font-size: 1.7rem;
      font-weight: 700;
      cursor: pointer;
    }

    .letter-tile-btn:hover {
      background: var(--accent-gold);
      color: #000;
    }

    /* Celebration Modal */
    .modal-backdrop {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(12px);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
    }

    .modal-backdrop.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      background: #0f172a;
      border: 1px solid var(--card-border);
      border-radius: var(--radius-xl);
      padding: 32px;
      text-align: center;
      max-width: 400px;
      width: 90%;
      box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    }

    .modal-sheet h2 {
      font-family: var(--font-main);
      font-size: 2rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
    }

    @keyframes gentle-bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(-10px); }
    }

    @keyframes pop-in {
      0% { transform: scale(0); }
      100% { transform: scale(1); }
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body>

  <canvas id="confetti-canvas"></canvas>

  <!-- Top Navigation -->
  <header>
    <div class="brand">
      <span class="brand-icon">🦕</span>
      <span>Dino Rescue</span>
    </div>

    <div class="pill-group">
      <div class="segmented-control">
        <button class="segment-btn active" id="btn-sub-math">🧮 Math</button>
        <button class="segment-btn" id="btn-sub-words">🔤 Words</button>
      </div>

      <button class="btn-sound" id="btn-sound-toggle">🔊 Sound On</button>

      <div class="star-badge">
        <span>⭐</span>
        <span id="star-count">0</span>
      </div>
    </div>
  </header>

  <!-- Main Layout -->
  <main>
    <!-- Dino Patient Stage -->
    <section class="card patient-card">
      <div class="patient-title">
        <span id="patient-icon">🦖</span>
        <span id="patient-name">Rexy</span>
      </div>

      <div class="progress-pill-track">
        <div class="progress-pill-fill" id="progress-fill"></div>
      </div>

      <div class="dino-stage-box">
        <div class="dino-avatar" id="dino-avatar"></div>
        <div class="dirt-overlay" id="dirt-overlay"></div>
      </div>

      <div class="status-text" id="status-text">
        Clean mud to heal Rexy! 🧼
      </div>
    </section>

    <!-- Interactive Workspace Card -->
    <section class="card workspace-card">
      <div class="question-banner">
        <button class="btn-speaker" id="btn-read-question" title="Listen to Question">🔊</button>
        <div class="question-title" id="question-title">
          10 + 2 = <span class="highlight">?</span>
        </div>
      </div>

      <!-- BIG VISIBLE ANSWER DISPLAY BOX -->
      <div class="answer-display-row">
        <div class="answer-box" id="answer-box">?</div>
        <button class="btn-clear" id="btn-clear">⌫ Clear</button>
      </div>

      <!-- Dynamic Workspace: Ten-Frame OR Phonics -->
      <div id="workspace-dynamic"></div>

      <!-- Keypad & Check Action -->
      <div class="controls-area">
        <div class="keypad-grid" id="keypad-grid">
          <button class="key-button" data-val="1">1</button>
          <button class="key-button" data-val="2">2</button>
          <button class="key-button" data-val="3">3</button>
          <button class="key-button" data-val="4">4</button>
          <button class="key-button" data-val="5">5</button>
          <button class="key-button" data-val="6">6</button>
          <button class="key-button" data-val="7">7</button>
          <button class="key-button" data-val="8">8</button>
          <button class="key-button" data-val="9">9</button>
          <button class="key-button" data-val="0">0</button>
        </div>

        <button class="primary-check-btn" id="btn-check">
          <span>Check Answer</span> ✨
        </button>
      </div>
    </section>
  </main>

  <!-- Celebration Modal -->
  <div class="modal-backdrop" id="modal-victory">
    <div class="modal-sheet">
      <h2>Patient Rescued! 🎉</h2>
      <div style="font-size: 4rem; margin: 16px 0;" id="modal-icon">🦖</div>
      <p style="color: var(--text-secondary); margin-bottom: 24px;">You healed Rexy!</p>
      <button class="primary-check-btn" id="btn-next" style="width: 100%;">
        Next Patient 🩺
      </button>
    </div>
  </div>

  <script>
    /* Robust Audio Synthesizer & Speech Engine */
    class AudioEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
        this.scale = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25, 587.33, 659.25, 698.46, 783.99];
      }

      initCtx() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      playTap(idx) {
        if (!this.enabled) return;
        this.initCtx();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(this.scale[idx % this.scale.length], this.ctx.currentTime);
          gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.25);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.25);
        } catch (e) { console.log(e); }
      }

      playBubble() {
        if (!this.enabled) return;
        this.initCtx();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(700, this.ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.15);
        } catch (e) { console.log(e); }
      }

      speak(text) {
        if (!this.enabled || !('speechSynthesis' in window)) return;
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.pitch = 1.2;
        u.rate = 0.95;
        window.speechSynthesis.speak(u);
      }
    }

    const audio = new AudioEngine();

    // Auto-unlock audio context on first user click anywhere
    window.addEventListener('click', () => audio.initCtx(), { once: true });
    window.addEventListener('touchstart', () => audio.initCtx(), { once: true });

    /* Patients */
    const patients = [
      { name: 'Rexy', species: 'Baby T-Rex', icon: '🦖', color: '#34d399' },
      { name: 'Trike', species: 'Triceratops', icon: '🦕', color: '#ffb703' },
      { name: 'Steggy', species: 'Stegosaurus', icon: '🐊', color: '#fb7185' }
    ];

    let currentPatientIdx = 0;
    let patientHealth = 25;
    let stars = 0;
    let activeSubject = 'math';
    let typedAnswer = '';
    let num1 = 10;
    let num2 = 2;
    let currentTarget = 12;
    let targetWord = 'DINO';
    let userWord = [];
    let currentSpeechPrompt = 'What is 10 plus 2?';

    function renderDino() {
      const p = patients[currentPatientIdx];
      document.getElementById('patient-name').innerText = p.name;
      document.getElementById('patient-icon').innerText = p.icon;
      document.getElementById('progress-fill').style.width = `${patientHealth}%`;

      const avatar = document.getElementById('dino-avatar');
      avatar.innerHTML = `
        <svg viewBox="0 0 200 200" width="100%" height="100%">
          <path d="M 40 130 Q 10 120 20 90 Q 40 100 60 120 Z" fill="${p.color}" />
          <ellipse cx="100" cy="130" rx="50" ry="40" fill="${p.color}" />
          <rect x="70" y="155" width="18" height="30" rx="8" fill="${p.color}" />
          <rect x="110" y="155" width="18" height="30" rx="8" fill="${p.color}" />
          <path d="M 120 110 Q 140 80 150 60 Q 175 60 180 85 Q 160 110 130 120 Z" fill="${p.color}" />
          <circle cx="158" cy="72" r="7" fill="#ffffff" />
          <circle cx="160" cy="72" r="3.5" fill="#000000" />
          <circle cx="162" cy="70" r="1.2" fill="#ffffff" />
          <path d="M 165 85 Q 155 92 145 86" fill="none" stroke="#000" stroke-width="2.5" stroke-linecap="round" />
        </svg>
      `;

      renderDirt();
    }

    function renderDirt() {
      const overlay = document.getElementById('dirt-overlay');
      overlay.innerHTML = '';
      const coords = [
        { top: '35%', left: '35%', size: '28px' },
        { top: '50%', left: '50%', size: '34px' },
        { top: '60%', left: '28%', size: '30px' }
      ];
      coords.forEach((c, i) => {
        const d = document.createElement('div');
        d.className = 'dirt-dot';
        d.id = `dirt-${i}`;
        d.style.top = c.top;
        d.style.left = c.left;
        d.style.width = c.size;
        d.style.height = c.size;
        overlay.appendChild(d);
      });
    }

    function updateAnswerDisplay() {
      const box = document.getElementById('answer-box');
      if (activeSubject === 'math') {
        box.innerText = typedAnswer !== '' ? typedAnswer : '?';
      } else {
        box.innerText = userWord.length > 0 ? userWord.join('') : '?';
      }
    }

    /* Workspace Renderer */
    function renderWorkspace() {
      const area = document.getElementById('workspace-dynamic');
      const title = document.getElementById('question-title');
      const keypad = document.getElementById('keypad-grid');

      if (activeSubject === 'math') {
        keypad.style.display = 'grid';
        title.innerHTML = `${num1} + ${num2} = <span class="highlight">?</span>`;

        area.innerHTML = '';
        const dualContainer = document.createElement('div');
        dualContainer.className = 'tenframe-dual-container';

        // Frame 1: Base 10
        const frame1Sec = document.createElement('div');
        frame1Sec.className = 'tenframe-section';
        frame1Sec.innerHTML = `<div class="tenframe-label">Ten-Frame 1 (Base 10)</div>`;
        const grid1 = document.createElement('div');
        grid1.className = 'tenframe-grid';

        for (let i = 0; i < 10; i++) {
          const slot = document.createElement('div');
          slot.className = 'tenframe-slot filled';
          slot.innerHTML = `<div class="egg-token">🥚</div>`;
          slot.addEventListener('click', () => audio.playTap(i));
          grid1.appendChild(slot);
        }
        frame1Sec.appendChild(grid1);
        dualContainer.appendChild(frame1Sec);

        // Frame 2: Extra Addend
        const frame2Sec = document.createElement('div');
        frame2Sec.className = 'tenframe-section';
        frame2Sec.innerHTML = `<div class="tenframe-label">Ten-Frame 2 (Add ${num2})</div>`;
        const grid2 = document.createElement('div');
        grid2.className = 'tenframe-grid';

        const extraCount = typedAnswer !== '' ? Math.max(0, parseInt(typedAnswer, 10) - 10) : num2;

        for (let i = 0; i < 10; i++) {
          const slot = document.createElement('div');
          const isFilled = i < extraCount;
          slot.className = `tenframe-slot ${isFilled ? 'filled' : ''}`;
          if (isFilled) {
            slot.innerHTML = `<div class="egg-token secondary">🪺</div>`;
          }
          slot.addEventListener('click', () => {
            const newTotal = 10 + (i + 1);
            typedAnswer = newTotal.toString();
            audio.playTap(10 + i);
            updateAnswerDisplay();
            renderWorkspace();
          });
          grid2.appendChild(slot);
        }
        frame2Sec.appendChild(grid2);
        dualContainer.appendChild(frame2Sec);

        area.appendChild(dualContainer);
      } else {
        keypad.style.display = 'none';
        title.innerHTML = `Spell: <span class="highlight">${targetWord}</span>`;

        area.innerHTML = '';
        const slotsDiv = document.createElement('div');
        slotsDiv.className = 'word-slots-container';

        for (let i = 0; i < targetWord.length; i++) {
          const slot = document.createElement('div');
          slot.className = `word-tile-slot ${userWord[i] ? 'filled' : ''}`;
          slot.innerText = userWord[i] || '_';
          slotsDiv.appendChild(slot);
        }
        area.appendChild(slotsDiv);

        const bankDiv = document.createElement('div');
        bankDiv.className = 'letter-tiles-bank';
        const letters = (targetWord + 'REST').split('').sort(() => Math.random() - 0.5);
        letters.forEach((letter, idx) => {
          const btn = document.createElement('button');
          btn.className = 'letter-tile-btn';
          btn.innerText = letter;
          btn.addEventListener('click', () => {
            if (userWord.length < targetWord.length) {
              userWord.push(letter);
              audio.playTap(idx);
              audio.speak(letter.toLowerCase());
              updateAnswerDisplay();
              renderWorkspace();
            }
          });
          bankDiv.appendChild(btn);
        });
        area.appendChild(bankDiv);
      }
    }

    function newQuestion() {
      typedAnswer = '';
      userWord = [];
      if (activeSubject === 'math') {
        num1 = 10;
        num2 = Math.floor(Math.random() * 8) + 1;
        currentTarget = num1 + num2;
        currentSpeechPrompt = `What is 10 plus ${num2}?`;
      } else {
        const words = ['DINO', 'ROAR', 'BONE', 'EGG', 'PARK', 'REXY'];
        targetWord = words[Math.floor(Math.random() * words.length)];
        currentSpeechPrompt = `Spell ${targetWord}`;
      }
      updateAnswerDisplay();
      renderWorkspace();
    }

    function checkAnswer() {
      audio.initCtx();
      let correct = false;
      if (activeSubject === 'math') {
        const val = parseInt(typedAnswer, 10);
        correct = (val === currentTarget);
      } else {
        correct = (userWord.join('') === targetWord);
      }

      if (correct) {
        stars += 1;
        document.getElementById('star-count').innerText = stars;

        audio.playBubble();
        if (activeSubject === 'words') {
          audio.speak(`${targetWord}! Great job!`);
        }

        patientHealth = Math.min(100, patientHealth + 34);
        document.getElementById('progress-fill').style.width = `${patientHealth}%`;

        const dots = document.querySelectorAll('.dirt-dot:not([style*="opacity: 0"])');
        if (dots.length > 0) {
          dots[0].style.opacity = '0';
          dots[0].style.transform = 'scale(1.4)';
        }

        if (patientHealth >= 100) {
          document.getElementById('dino-avatar').classList.add('happy');
          audio.speak('Awesome! Rexy is healed!');
          triggerConfetti();
          document.getElementById('modal-victory').classList.add('active');
        } else {
          audio.playTap(9);
          setTimeout(() => newQuestion(), 800);
        }
      } else {
        audio.playBubble();
        audio.speak('Try again!');
        document.getElementById('answer-box').style.borderColor = '#fb7185';
        setTimeout(() => document.getElementById('answer-box').style.borderColor = 'var(--accent-gold)', 600);
      }
    }

    /* Event Listeners */
    document.getElementById('btn-sub-math').addEventListener('click', () => {
      audio.initCtx();
      activeSubject = 'math';
      document.getElementById('btn-sub-math').classList.add('active');
      document.getElementById('btn-sub-words').classList.remove('active');
      newQuestion();
    });

    document.getElementById('btn-sub-words').addEventListener('click', () => {
      audio.initCtx();
      activeSubject = 'words';
      document.getElementById('btn-sub-words').classList.add('active');
      document.getElementById('btn-sub-math').classList.remove('active');
      newQuestion();
    });

    document.getElementById('btn-read-question').addEventListener('click', () => {
      audio.initCtx();
      audio.speak(currentSpeechPrompt);
    });

    document.getElementById('btn-sound-toggle').addEventListener('click', () => {
      audio.initCtx();
      audio.enabled = !audio.enabled;
      document.getElementById('btn-sound-toggle').innerText = audio.enabled ? '🔊 Sound On' : '🔇 Sound Off';
      if (audio.enabled) audio.playTap(4);
    });

    document.querySelectorAll('.key-button').forEach(b => {
      b.addEventListener('click', (e) => {
        audio.initCtx();
        const v = e.target.dataset.val;
        audio.playTap(parseInt(v, 10));
        typedAnswer += v;
        updateAnswerDisplay();
        renderWorkspace();
      });
    });

    document.getElementById('btn-clear').addEventListener('click', () => {
      audio.initCtx();
      audio.playTap(1);
      typedAnswer = '';
      userWord = [];
      updateAnswerDisplay();
      renderWorkspace();
    });

    document.getElementById('btn-check').addEventListener('click', checkAnswer);

    document.getElementById('btn-next').addEventListener('click', () => {
      audio.initCtx();
      document.getElementById('modal-victory').classList.remove('active');
      document.getElementById('dino-avatar').classList.remove('happy');
      currentPatientIdx = (currentPatientIdx + 1) % patients.length;
      patientHealth = 25;
      renderDino();
      newQuestion();
    });

    function triggerConfetti() {
      const canvas = document.getElementById('confetti-canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      const particles = [];
      const colors = ['#ffb703', '#34d399', '#38bdf8', '#fb7185'];
      for (let i = 0; i < 70; i++) {
        particles.push({
          x: canvas.width / 2, y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.7) * 14,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4
        });
      }
      let f = 0;
      function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        particles.forEach(p => {
          p.x += p.vx; p.y += p.vy; p.vy += 0.3;
          ctx.fillStyle = p.color;
          ctx.fillRect(p.x, p.y, p.size, p.size);
        });
        f++;
        if (f < 100) requestAnimationFrame(loop);
        else ctx.clearRect(0, 0, canvas.width, canvas.height);
      }
      loop();
    }

    window.addEventListener('DOMContentLoaded', () => {
      renderDino();
      newQuestion();
    });
  </script>
</body>
</html>
